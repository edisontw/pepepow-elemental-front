<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100f" />
    <meta
      name="description"
      content="PEPEPOW Elemental Front — deterministic browser RTS prototype"
    />
    <title>Elemental Front｜元素戰線</title>
  </head>
  <body>
    <main id="app" aria-label="Elemental Front game shell">
      <canvas id="game-canvas" aria-label="RTS battlefield"></canvas>
      <section id="boot-screen" role="status" aria-live="polite">
        <p class="eyebrow">PEPEPOW</p>
        <h1>ELEMENTAL FRONT</h1>
        <p>正在初始化戰場系統…</p>
      </section>
      <aside id="debug-overlay" aria-label="Debug information"></aside>
      <aside id="arena-legend" aria-label="Arena terrain legend">
        <b>M01 固定測試場</b>
        <span><i class="swatch ground"></i>一般地面</span>
        <span><i class="swatch forest"></i>森林區</span>
        <span><i class="swatch river"></i>河流</span>
        <span><i class="swatch choke"></i>隘口</span>
        <span><i class="swatch crossing"></i>未來冰凍渡口</span>
      </aside>
      <div id="selection-box" hidden></div>
      <div id="camera-help">左鍵選取／拖曳框選 · 右鍵移動 · X 停止 · WASD／方向鍵移動鏡頭 · 滾輪縮放 · 中鍵拖曳</div>
      <div id="fatal-error" role="alert" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
