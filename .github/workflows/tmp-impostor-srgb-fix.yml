name: One-shot impostor sRGB fix

on:
  push:
    branches: [visual/impostor-srgb-fix]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/impostor-srgb-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Mark impostor color textures as sRGB
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/rendering/visual-asset-library.ts')
          text = path.read_text()
          old = """          mipmaps: false,
          minFilter: pc.FILTER_LINEAR,"""
          new = """          mipmaps: false,
          srgb: true,
          minFilter: pc.FILTER_LINEAR,"""
          if old not in text:
              raise SystemExit('impostor texture marker not found')
          if 'srgb: true' in text:
              raise SystemExit('sRGB flag already present')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run test -- --run tests/rendering/impostor-frame.test.ts tests/rendering/vanguard-impostor-frames.test.ts tests/rendering/elementalist-fire-impostor-frames.test.ts tests/rendering/batch-impostor-assets.test.ts
      - run: npm run build
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/tmp-impostor-srgb-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/visual-asset-library.ts .github/workflows/tmp-impostor-srgb-fix.yml
          git commit -m "fix: preserve impostor sRGB color"
          git push origin HEAD:visual/impostor-srgb-fix
