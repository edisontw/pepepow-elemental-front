name: One-shot siege perspective and building bar fix

on:
  push:
    branches: [fix/siege-perspective-building-bars]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/siege-perspective-building-bars
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch siege sprite aspect and building bar layering
        run: |
          python - <<'PY'
          from pathlib import Path

          visual = Path('src/rendering/visual-asset-library.ts')
          text = visual.read_text()
          old = """  ['unit.siege-construct', {
            id: 'unit.siege-construct',
            label: 'Siege Construct',
            frameFiles: impostorFrameFiles('siege-construct'),
            frameRemap: SCREEN_FACING_TURNAROUND_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 2.55,
            height: 1.82,
            shadowX: 1.45,
            shadowZ: 1.0,
          }],"""
          new = """  ['unit.siege-construct', {
            id: 'unit.siege-construct',
            label: 'Siege Construct',
            frameFiles: impostorFrameFiles('siege-construct'),
            frameRemap: SCREEN_FACING_TURNAROUND_FRAME_REMAP,
            headingOffsetDegrees: 0,
            // Keep the 192x256 source frame near its native aspect. The prior
            // 2.55x1.82 plane stretched this wide vehicle almost 2x horizontally,
            // making the elevated turnaround read like a flattened top view.
            width: 2.25,
            height: 3.0,
            shadowX: 1.45,
            shadowZ: 1.0,
          }],"""
          if old not in text:
              raise SystemExit('siege impostor config marker not found')
          visual.write_text(text.replace(old, new, 1))

          strategic = Path('src/rendering/strategic-render-bridge.ts')
          text = strategic.read_text()
          old = "presentation.healthBar.setLocalPosition(-(1 - ratio) * width * 0.5, y + 0.012, 0);"
          new = "presentation.healthBar.setLocalPosition(-(1 - ratio) * width * 0.5, y + 0.04, 0);"
          if old not in text:
              raise SystemExit('building health bar marker not found')
          strategic.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/tmp-fix-siege-bars.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/visual-asset-library.ts src/rendering/strategic-render-bridge.ts .github/workflows/tmp-fix-siege-bars.yml
          git commit -m "fix: correct siege aspect and building progress bars"
          git push origin HEAD:fix/siege-perspective-building-bars
