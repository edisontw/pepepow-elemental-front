name: QA Impostor Direction Audit Current

on:
  push:
    branches:
      - qa/impostor-direction-audit-current

jobs:
  contact-sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Build contact sheets and metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import csv

          root = Path('public/assets/impostors')
          out = Path('qa-contact-sheets-current')
          out.mkdir(exist_ok=True)
          names = [
              '00-front.webp','01-front-left.webp','02-left.webp','03-rear-left.webp',
              '04-rear.webp','05-rear-right.webp','06-right.webp','07-front-right.webp',
          ]
          font = ImageFont.load_default()
          rows = []
          for unit_dir in sorted(p for p in root.iterdir() if p.is_dir()):
              sheet = Image.new('RGBA', (320 * 4, 440 * 2), (28, 30, 34, 255))
              draw = ImageDraw.Draw(sheet)
              for i, name in enumerate(names):
                  src = unit_dir / name
                  im = Image.open(src).convert('RGBA')
                  bbox = im.getchannel('A').getbbox()
                  rows.append([unit_dir.name,name,im.width,im.height,*(bbox or ('','','',''))])
                  # Runtime-normalized preview: every full source frame occupies the same 288x384 rectangle.
                  shown = im.resize((288,384), Image.Resampling.LANCZOS)
                  col, row = i % 4, i // 4
                  x0, y0 = col * 320, row * 440
                  sheet.alpha_composite(shown, (x0 + 16, y0 + 8))
                  draw.rectangle((x0, y0, x0 + 319, y0 + 439), outline=(110,116,126,255), width=1)
                  draw.rectangle((x0, y0 + 400, x0 + 320, y0 + 440), fill=(15,17,20,255))
                  draw.text((x0 + 8, y0 + 414), f'{i}: {name}', fill=(240,240,240,255), font=font)
              sheet.save(out / f'{unit_dir.name}.png')
          with open('qa-impostor-metadata.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['slug','file','width','height','alpha_left','alpha_top','alpha_right','alpha_bottom']); w.writerows(rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: impostor-direction-contact-sheets-current-v2
          path: |
            qa-contact-sheets-current/*.png
            qa-impostor-metadata.csv
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: impostor-raw-current-main
          path: public/assets/impostors/**/*.webp
          retention-days: 1
