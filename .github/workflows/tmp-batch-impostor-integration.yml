name: One-shot batch impostor integration

on:
  push:
    branches: [visual/batch-impostor-integration]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/batch-impostor-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate uploaded impostor sets
        run: |
          python - <<'PY'
          from pathlib import Path

          visual = Path('src/rendering/visual-asset-library.ts')
          text = visual.read_text()
          old_import = "import { remapImpostorFrame } from './impostor-frame-assets';"
          new_import = "import { IDENTITY_IMPOSTOR_FRAME_REMAP, impostorFrameFiles, remapImpostorFrame } from './impostor-frame-assets';"
          if old_import not in text:
              raise SystemExit('visual asset import marker not found')
          text = text.replace(old_import, new_import, 1)

          marker = "  }],\n]);\n\ninterface ImpostorHandle"
          if marker not in text:
              raise SystemExit('impostor config insertion marker not found')
          extra = """  }],
          ['unit.elementalist.water', {
            id: 'unit.elementalist.water',
            label: 'Water Elementalist',
            frameFiles: impostorFrameFiles('elementalist-water'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 1.72,
            height: 2.3,
            shadowX: 0.86,
            shadowZ: 0.62,
          }],
          ['unit.elementalist.ice', {
            id: 'unit.elementalist.ice',
            label: 'Ice Elementalist',
            frameFiles: impostorFrameFiles('elementalist-ice'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 1.72,
            height: 2.3,
            shadowX: 0.86,
            shadowZ: 0.62,
          }],
          ['unit.elementalist.lightning', {
            id: 'unit.elementalist.lightning',
            label: 'Lightning Elementalist',
            frameFiles: impostorFrameFiles('elementalist-lightning'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 1.72,
            height: 2.3,
            shadowX: 0.86,
            shadowZ: 0.62,
          }],
          ['unit.spear-guard', {
            id: 'unit.spear-guard',
            label: 'Spear Guard',
            frameFiles: impostorFrameFiles('spear-guard'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 1.36,
            height: 1.82,
            shadowX: 0.78,
            shadowZ: 0.58,
          }],
          ['unit.ranger', {
            id: 'unit.ranger',
            label: 'Ranger',
            frameFiles: impostorFrameFiles('ranger'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 1.18,
            height: 1.56,
            shadowX: 0.72,
            shadowZ: 0.52,
          }],
          ['unit.scout', {
            id: 'unit.scout',
            label: 'Scout',
            frameFiles: impostorFrameFiles('scout'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 0.96,
            height: 1.24,
            shadowX: 0.64,
            shadowZ: 0.46,
          }],
          ['unit.engineer', {
            id: 'unit.engineer',
            label: 'Engineer',
            frameFiles: impostorFrameFiles('engineer'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 1.22,
            height: 1.58,
            shadowX: 0.78,
            shadowZ: 0.56,
          }],
          ['unit.golem', {
            id: 'unit.golem',
            label: 'Golem',
            frameFiles: impostorFrameFiles('golem'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 2.05,
            height: 2.46,
            shadowX: 1.28,
            shadowZ: 0.9,
          }],
          ['unit.siege-construct', {
            id: 'unit.siege-construct',
            label: 'Siege Construct',
            frameFiles: impostorFrameFiles('siege-construct'),
            frameRemap: IDENTITY_IMPOSTOR_FRAME_REMAP,
            headingOffsetDegrees: 0,
            width: 2.55,
            height: 1.82,
            shadowX: 1.45,
            shadowZ: 1.0,
          }],
          ]);

          interface ImpostorHandle"""
          text = text.replace(marker, extra, 1)
          visual.write_text(text)

          bridge = Path('src/rendering/unit-render-bridge.ts')
          text = bridge.read_text()
          old = """      const specialistModelId: Readonly<Record<string, string>> = {
                SPEAR_GUARD: 'unit.spear-guard',
                RANGER: 'unit.ranger',
                SCOUT: 'unit.scout',
                ENGINEER: 'unit.engineer',
              };"""
          new = """      const specialistModelId: Readonly<Record<string, string>> = {
                SPEAR_GUARD: 'unit.spear-guard',
                RANGER: 'unit.ranger',
                SCOUT: 'unit.scout',
                ENGINEER: 'unit.engineer',
                GOLEM: 'unit.golem',
                SIEGE_CONSTRUCT: 'unit.siege-construct',
              };"""
          if old not in text:
              raise SystemExit('unit model resolver marker not found')
          bridge.write_text(text.replace(old, new, 1))

          test = Path('tests/rendering/batch-impostor-assets.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
          import {
            IDENTITY_IMPOSTOR_FRAME_REMAP,
            IMPOSTOR_DIRECTION_FILENAMES,
            impostorFrameFiles,
          } from '../../src/rendering/impostor-frame-assets';

          const SLUGS = [
            'elementalist-water',
            'elementalist-ice',
            'elementalist-lightning',
            'spear-guard',
            'ranger',
            'scout',
            'engineer',
            'golem',
            'siege-construct',
          ] as const;

          describe('batch unit impostor static paths', () => {
            it('uses the canonical eight runtime filenames for every uploaded unit set', () => {
              for (const slug of SLUGS) {
                expect(impostorFrameFiles(slug)).toEqual(
                  IMPOSTOR_DIRECTION_FILENAMES.map((filename) => `assets/impostors/${slug}/${filename}`),
                );
              }
            });

            it('keeps the new source sheets in canonical observer-side order', () => {
              expect(IDENTITY_IMPOSTOR_FRAME_REMAP).toEqual([0, 1, 2, 3, 4, 5, 6, 7]);
            });
          });
          """)
          PY
      - run: npm ci
      - run: npm run test -- --run tests/rendering/impostor-frame.test.ts tests/rendering/vanguard-impostor-frames.test.ts tests/rendering/elementalist-fire-impostor-frames.test.ts tests/rendering/batch-impostor-assets.test.ts
      - run: npm run build
      - name: Commit integrated runtime and remove one-shot workflow
        run: |
          rm .github/workflows/tmp-batch-impostor-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/visual-asset-library.ts src/rendering/unit-render-bridge.ts tests/rendering/batch-impostor-assets.test.ts .github/workflows/tmp-batch-impostor-integration.yml
          git commit -m "feat: integrate batch unit impostors"
          git push origin HEAD:visual/batch-impostor-integration
