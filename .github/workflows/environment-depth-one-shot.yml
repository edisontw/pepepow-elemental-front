name: Environment Depth One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/environment-depth-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply presentation-only environment depth pass
        run: |
          echo '' | base64 -d > /tmp/environment-depth-patch.py
          sed -i 's/{llabel}/{label}/g' /tmp/environment-depth-patch.py
          python /tmp/environment-depth-patch.py
      - run: npm run build
      - run: git diff --check
      - name: Commit environment polish and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rendering/environment-detail-layer.ts
          git rm .github/workflows/environment-depth-one-shot.yml
          git commit -m 'visual: deepen forest river and route integration'
          git push
