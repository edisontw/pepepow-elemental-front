name: Environment Depth One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/environment-depth-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply presentation-only environment depth pass
        run: |
          echo '' | base64 -d > /tmp/environment-depth-patch.py[0m
