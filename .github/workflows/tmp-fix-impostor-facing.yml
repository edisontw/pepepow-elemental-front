name: One-shot impostor facing fix

on:
  push:
    branches: [fix/impostor-facing-8dir]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/impostor-facing-8dir
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch 8-direction facing pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          assets = Path('src/rendering/impostor-frame-assets.ts')
          text = assets.read_text()
          old = '''/**
 * Some AI turnarounds interpret "left" / "right" as the direction the
 * character points on the sheet rather than the side from which the observer
 * sees the character. Front/rear remain correct while every side pair is
 * reversed. This remap converts canonical observer-side view indices into that
 * source-sheet convention without changing simulation heading semantics.
 */
export const SCREEN_FACING_TURNAROUND_FRAME_REMAP = [0, 7, 6, 5, 4, 3, 2, 1] as const;
'''
          new = '''/**
 * AI turnaround sheets are authored in the same 4x2 order as the canonical
 * filenames. With the fixed 45 degree RTS camera, impostorFrameForHeading()
 * already advances through those source frames in screen-facing order:
 * down, down-right, right, up-right, up, up-left, left, down-left.
 * Do not reverse the side frames here; that makes lower-right motion display
 * a left-facing sprite and upper-right motion use the wrong diagonal.
 */
export const SCREEN_FACING_TURNAROUND_FRAME_REMAP = IDENTITY_IMPOSTOR_FRAME_REMAP;
'''
          if old not in text:
              raise SystemExit('expected frame remap block not found')
          assets.write_text(text.replace(old, new))

          frame = Path('src/rendering/impostor-frame.ts')
          text = frame.read_text()
          anchor = '''function angularDistanceDegrees(first: number, second: number): number {
  const delta = normalizeDegrees(first - second + 180) - 180;
  return Math.abs(delta);
}
'''
          insertion = anchor + '''\n/** World +Z is heading 0; positive yaw turns toward world +X. */\nexport function headingDegreesForWorldDelta(deltaX: number, deltaZ: number): number {\n  return Math.atan2(deltaX, deltaZ) * 180 / Math.PI;\n}\n'''
          if anchor not in text:
              raise SystemExit('impostor-frame anchor not found')
          frame.write_text(text.replace(anchor, insertion))

          bridge = Path('src/rendering/unit-render-bridge.ts')
          text = bridge.read_text()
          import_anchor = "import { unitVisualProfile, type UnitProjectileStyle } from './unit-visual-profile';\n"
          if import_anchor not in text:
              raise SystemExit('unit bridge import anchor not found')
          text = text.replace(import_anchor, import_anchor + "import { headingDegreesForWorldDelta } from './impostor-frame';\n")
          old = '''function facingYawDegrees(fromX: number, fromZ: number, toX: number, toZ: number): number {
  return Math.atan2(toX - fromX, toZ - fromZ) * 180 / Math.PI;
}
'''
          new = '''function facingYawDegrees(fromX: number, fromZ: number, toX: number, toZ: number): number {
  return headingDegreesForWorldDelta(toX - fromX, toZ - fromZ);
}
'''
          if old not in text:
              raise SystemExit('facingYawDegrees block not found')
          text = text.replace(old, new)
          old = "presentation.root.setEulerAngles(0, Math.atan2(deltaX, deltaZ) * 180 / Math.PI, 0);"
          new = "presentation.root.setEulerAngles(0, headingDegreesForWorldDelta(deltaX, deltaZ), 0);"
          if old not in text:
              raise SystemExit('movement heading expression not found')
          bridge.write_text(text.replace(old, new))

          test = Path('tests/rendering/impostor-frame.test.ts')
          text = test.read_text()
          text = text.replace(
              "  impostorAtlasOffset,\n  impostorFrameForHeading,\n  stableImpostorFrameForHeading,\n",
              "  headingDegreesForWorldDelta,\n  impostorAtlasOffset,\n  impostorFrameForHeading,\n  stableImpostorFrameForHeading,\n",
          )
          old = '''  it('remaps screen-facing AI turnaround labels without corrupting front/rear views', () => {
    expect(remapImpostorFrame(0, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(0);
    expect(remapImpostorFrame(1, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(7);
    expect(remapImpostorFrame(2, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(6);
    expect(remapImpostorFrame(3, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(5);
    expect(remapImpostorFrame(4, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(4);
    expect(remapImpostorFrame(5, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(3);
    expect(remapImpostorFrame(6, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(2);
    expect(remapImpostorFrame(7, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(1);
  });
'''
          new = '''  it('keeps canonical AI turnaround source frames in screen-facing order', () => {
    for (let frame = 0; frame < 8; frame += 1) {
      expect(remapImpostorFrame(frame, SCREEN_FACING_TURNAROUND_FRAME_REMAP)).toBe(frame);
    }
  });

  it('maps all eight world movement vectors to the matching fixed-camera source frame', () => {
    // Fixed camera yaw is 45 degrees. The canonical source sheet visually faces:
    // down, down-right, right, up-right, up, up-left, left, down-left.
    const cases = [
      { label: 'down', deltaX: 1, deltaZ: 1, sourceFrame: 0 },
      { label: 'down-right', deltaX: 1, deltaZ: 0, sourceFrame: 1 },
      { label: 'right', deltaX: 1, deltaZ: -1, sourceFrame: 2 },
      { label: 'up-right', deltaX: 0, deltaZ: -1, sourceFrame: 3 },
      { label: 'up', deltaX: -1, deltaZ: -1, sourceFrame: 4 },
      { label: 'up-left', deltaX: -1, deltaZ: 0, sourceFrame: 5 },
      { label: 'left', deltaX: -1, deltaZ: 1, sourceFrame: 6 },
      { label: 'down-left', deltaX: 0, deltaZ: 1, sourceFrame: 7 },
    ] as const;

    for (const { label, deltaX, deltaZ, sourceFrame } of cases) {
      const heading = headingDegreesForWorldDelta(deltaX, deltaZ);
      const viewFrame = impostorFrameForHeading(heading);
      expect(
        remapImpostorFrame(viewFrame, SCREEN_FACING_TURNAROUND_FRAME_REMAP),
        label,
      ).toBe(sourceFrame);
    }
  });
'''
          if old not in text:
              raise SystemExit('old remap test not found')
          test.write_text(text.replace(old, new))
          PY
      - run: npm ci
      - name: Run focused facing QA
        run: npx vitest run tests/rendering/impostor-frame.test.ts
      - run: npm run build
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/tmp-fix-impostor-facing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rendering/impostor-frame.ts src/rendering/impostor-frame-assets.ts src/rendering/unit-render-bridge.ts tests/rendering/impostor-frame.test.ts
          git commit -m 'fix: correct eight-direction impostor facing'
          git push origin HEAD:fix/impostor-facing-8dir
