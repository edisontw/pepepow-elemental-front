name: Forest Readability Refine One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forest-readability-refine-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply forest readability refinement
        run: python scripts/tmp_forest_readability_refine.py
      - run: npm run build
      - run: git diff --check
      - name: Commit refinement and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rendering/generated-world-render-bridge.ts src/rendering/environment-detail-layer.ts
          git rm scripts/tmp_forest_readability_refine.py .github/workflows/forest-readability-refine-one-shot.yml
          git commit -m 'visual: open forest edges and protect route readability'
          git push
