name: Forest Massing One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forest-massing-one-shot.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply denser taller forest presentation
        run: python scripts/tmp_forest_massing_patch.py
      - run: npm run build
      - run: git diff --check
      - name: Commit forest visual pass and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rendering/generated-world-render-bridge.ts src/rendering/environment-detail-layer.ts
          git rm scripts/tmp_forest_massing_patch.py .github/workflows/forest-massing-one-shot.yml
          git commit -m 'visual: densify and deepen woodland canopy'
          git push
      - name: Deploy final main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh workflow run deploy-pages.yml --ref main
